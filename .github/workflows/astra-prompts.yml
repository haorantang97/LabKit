name: Astra Prompts
on:
  push:
    paths:
      - 'skills/astra-prompts/**'
      - '.github/workflows/astra-prompts.yml'
  pull_request:
    paths:
      - 'skills/astra-prompts/**'
      - '.github/workflows/astra-prompts.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s skills/astra-prompts/tests -v
